# This workflow runs benchmarks and detects performance regressions.
# Both versions are benchmarked on the SAME runner: for pull requests the
# baseline (master) runs in a git worktree within the same job, right next
# to the PR code. Comparing JSON reports produced by different runner
# machines is unreliable — the shared ubuntu-latest pool mixes CPU
# generations, which shifts all microbenchmarks by 10-30%.
name: Benchmark

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with BENCH_FLAGS in the justfile.
  BENCH_FLAGS: "--benchmark-min-rounds=50 --benchmark-max-time=5.0 --benchmark-disable-gc --benchmark-warmup-iterations=100"
  PYTHONHASHSEED: "0"

jobs:
  benchmark:
    name: python-benchmark
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore uv cache
        uses: actions/cache@v5
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Fetch master for the baseline
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin master:master

      # The baseline runs first, on a cold machine, so thermal drift can
      # only make the PR code look slower, never mask a real regression.
      - name: Run benchmarks (master baseline, same runner)
        if: github.event_name == 'pull_request'
        run: |
          git worktree add ../pulya-master master
          cd ../pulya-master
          uv sync --locked --all-extras --dev
          uv run pytest benchmarks/ --benchmark-only ${BENCH_FLAGS} --benchmark-json=benchmark-master.json
          cp benchmark-master.json "$GITHUB_WORKSPACE/"

      - name: Run benchmarks (current)
        run: |
          uv run pytest benchmarks/ --benchmark-only ${BENCH_FLAGS} --benchmark-json=benchmark-current.json

      - name: Compare against baseline
        if: github.event_name == 'pull_request'
        run: |
          uv run python tools/compare_benchmarks.py benchmark-master.json benchmark-current.json --fail-on-regression 15

      - name: Store benchmark report (master and manual runs only)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}
          path: benchmark-current.json
