# This workflow runs benchmarks and detects performance regressions.
# CI compares CI runs against CI runs: the baseline is a JSON report produced
# by a master run on the same runners, passed through actions/cache.
# Cache entries die after 7 days without access, so after a long project
# inactivity run this workflow manually on master ("workflow_dispatch")
# to rebuild the baseline.
name: Benchmark

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with BENCH_FLAGS in the justfile.
  BENCH_FLAGS: "--benchmark-min-rounds=50 --benchmark-max-time=5.0 --benchmark-disable-gc --benchmark-warmup-iterations=100"
  PYTHONHASHSEED: "0"

jobs:
  benchmark:
    name: python-benchmark
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore uv cache
        uses: actions/cache@v5
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run benchmarks
        run: |
          uv run pytest benchmarks/ --benchmark-only ${BENCH_FLAGS} --benchmark-json=benchmark-current.json

      - name: Restore baseline (pull requests only)
        if: github.event_name == 'pull_request'
        id: baseline-cache
        uses: actions/cache/restore@v4
        with:
          # Unique key per master run; prefix match picks the freshest one.
          key: pulya-bench-
          restore-keys: pulya-bench-

      - name: Compare against baseline
        if: github.event_name == 'pull_request' && steps.baseline-cache.outputs.cache-hit == 'true'
        run: |
          uv run python tools/compare_benchmarks.py benchmark-master.json benchmark-current.json --fail-on-regression 15

      - name: Report missing baseline
        if: github.event_name == 'pull_request' && steps.baseline-cache.outputs.cache-hit != 'true'
        run: |
          echo "::warning::No benchmark baseline found in cache. Run the Benchmark workflow on master to create one; skipping comparison."

      - name: Save baseline (master and manual runs only)
        if: github.event_name != 'pull_request'
        run: cp benchmark-current.json benchmark-master.json
      - name: Cache baseline
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: benchmark-master.json
          key: pulya-bench-${{ github.run_id }}
